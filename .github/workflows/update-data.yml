name: Update GPU data

# 每周一 02:00 UTC（北京时间 10:00）刷新一次 instances.vantage.sh 数据。
# 关键约束：一致性测试不通过就不提交。
# 2026-08 数据源新增 g7 家族时，GPU_MODELS / GPU_MEMORY / FAMILY_INFO 三处配置
# 都没有对应条目，结果数据里是 "Unknown GPU"、详情页直接被跳过。如果那时已经有
# 自动提交，这份坏数据会直接上线。所以这里宁可停下开 Issue，也不发布 Unknown。

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:        # 允许手动触发，便于验证

permissions:
  contents: write           # 提交刷新后的数据
  issues: write             # 失败时开 Issue

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show disk before download
        run: df -h / | tail -1
        # instances.json 约 300MB，确认 runner 空间充足

      - name: Download and convert
        id: convert
        run: |
          python3 scripts/update_all.py --download
          python3 scripts/update_all.py --convert

      - name: Generate instance pages
        run: python3 scripts/update_all.py --pages

      - name: Consistency checks
        id: checks
        run: python3 scripts/test_meta_consistency.py

      - name: Detect changes
        id: diff
        run: |
          # 只看会被提交的文件；300MB 原始数据是 gitignore 的，不参与判断
          if git diff --quiet -- data/ instances/ index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，不提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/ instances/ index.html | tail -6
          fi

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ instances/ index.html
          COUNT=$(python3 -c "import json;d=open('data/meta.js').read();print(json.loads(d[d.find('{'):d.rfind(';')])['totalInstances'])")
          git commit -m "refresh gpu data from vantage.sh ($COUNT instances)"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Automated data update failed';
            // 已有同名未关闭 Issue 就追加评论，避免每周开一个新的
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'data-update'
            });
            const body = [
              'The weekly GPU data refresh failed, so **nothing was committed** and the live site still serves the previous good data.',
              '',
              `Run: ${run}`,
              '',
              'Most likely cause: the data source added a new instance family and the config maps have no entry for it.',
              'When that happens the family shows up as `Unknown GPU` / `Unknown` memory and `generate_pages` skips it.',
              '',
              'To fix, add the family to all three maps in `scripts/config.py`:',
              '- `GPU_MODELS` (put longer keys before their own prefixes, e.g. `g7e` before `g7`)',
              '- `GPU_MEMORY`',
              '- `FAMILY_INFO`',
              '',
              'Then add a row to the table in `index.html` (it is hand-maintained, not generated),',
              'and re-run this workflow.'
            ].join('\n');
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['data-update']
              });
            }
