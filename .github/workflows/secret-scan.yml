name: Secret scan

# Scans the whole history on every push and PR: built-in gitleaks rules,
# .gitleaks-rules.toml, and private rules from the GITLEAKS_PRIVATE_RULES secret.
# A red run means something sensitive got in: GitHub emails the repo owner.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSLo /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks

      - name: Scan full history (built-in rules)
        run: /tmp/gitleaks git . --redact --no-banner -v --log-opts="--all"

      - name: Scan full history (repo rules)
        run: /tmp/gitleaks git . --config .gitleaks-rules.toml --redact --no-banner -v --log-opts="--all"

      - name: Scan full history (private rules from secret)
        env:
          RULES_B64: ${{ secrets.GITLEAKS_PRIVATE_RULES }}
        run: |
          if [ -z "$RULES_B64" ]; then echo "::error::GITLEAKS_PRIVATE_RULES secret is missing"; exit 1; fi
          umask 077; echo "$RULES_B64" | base64 -d > "$RUNNER_TEMP/private.toml"
          /tmp/gitleaks git . --config "$RUNNER_TEMP/private.toml" --redact --no-banner -v --log-opts="--all"
          rm -f "$RUNNER_TEMP/private.toml"
